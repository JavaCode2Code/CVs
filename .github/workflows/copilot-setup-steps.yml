name: Job Matcher

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  match:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install scikit-learn

      - run: python match_jobs.py
